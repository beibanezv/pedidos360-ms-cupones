server.port=8088

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5436}/pedidos360_cupones
spring.datasource.username=${POSTGRES_USER:pedidos360}
spring.datasource.password=${POSTGRES_PASSWORD:pedidos360}
spring.jpa.hibernate.ddl-auto=update

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin123}
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# Cada cuánto revisa campañas vencidas (ms). En verificación viva se baja por env.
app.cupones.revision-ms=60000

# Entra ID y Cognito: crear cupon es solo de administracion; consultar y validar
# lo puede hacer un comprador (Azure o ID token de Cognito). En AWS se inyectan
# AZURE_TENANT_ID, AZURE_AUDIENCE, COGNITO_JWKS_URI y COGNITO_CLIENT_ID.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID:e5372bf0-c5e3-4286-887c-79069f209c1f}
azure.audience=${AZURE_AUDIENCE:api://446c57cb-aba2-4b7a-ab01-6f2e6af7d35c}
cognito.jwks-uri=${COGNITO_JWKS_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_A8lrPsDta/.well-known/jwks.json}
cognito.issuer=${COGNITO_ISSUER:}
cognito.client-id=${COGNITO_CLIENT_ID:2ba1fjeai3c2i77sb5dpd7j91m}

# Origenes CORS exactos, coma-separados. Sin wildcard ni cookies.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
