# Pedidos360 - ms-cupones (produccion) - PLACEHOLDERS, sin valores reales
# Produccion exige los valores publicos de ambos proveedores; C1 los inyecta por
# entorno. COGNITO_ISSUER es opcional y se deriva del JWKS.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/
azure.tenant-id=${AZURE_TENANT_ID}
azure.audience=${AZURE_AUDIENCE}
cognito.jwks-uri=${COGNITO_JWKS_URI}
cognito.issuer=${COGNITO_ISSUER:}
cognito.client-id=${COGNITO_CLIENT_ID}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
